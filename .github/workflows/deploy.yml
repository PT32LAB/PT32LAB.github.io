name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Triggered by vision-vault repo via repository_dispatch
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # When triggered by vault update, pull latest submodule content
      - name: Update vault submodule to latest
        if: github.event_name == 'repository_dispatch'
        run: |
          git submodule update --remote content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check for empty pages
        run: |
          find dist -name "index.html" -size 0 -print | tee /dev/stderr | [ $(wc -l) -eq 0 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
